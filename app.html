<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>캐시쉐이크 앱 받기 · phantomz inc</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #f8f9fa;
        color: #111827;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      main {
        text-align: center;
        padding: 24px;
        max-width: 360px;
      }
      h1 {
        color: #ff6a00;
        font-size: 28px;
        margin: 0 0 8px;
      }
      p {
        color: #6b7280;
        margin: 4px 0 20px;
      }
      .code {
        display: inline-block;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 6px 12px;
        color: #111827;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 16px;
      }
      a.btn {
        display: block;
        margin: 10px auto;
        padding: 14px 20px;
        border-radius: 12px;
        background: #ff6a00;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        max-width: 280px;
      }
      a.btn.secondary {
        background: #fff;
        color: #111827;
        border: 1px solid #e5e7eb;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>캐시쉐이크</h1>
      <p>흔들어서 포인트를 모으는 리워드 앱</p>
      <div id="codeWrap" style="display: none">
        <div class="code" id="code"></div>
        <p id="hint" style="font-size: 13px; margin: 0 0 16px">
          설치 버튼을 누르면 초대코드가 자동 복사되고,<br />
          설치 후 앱을 열면 자동 적용돼요.
        </p>
      </div>
      <a class="btn" id="iosBtn">App Store에서 받기</a>
      <a class="btn secondary" id="androidBtn">Google Play에서 받기</a>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var invite = (params.get("invite") || "").trim();

        var APP_STORE = "https://apps.apple.com/kr/app/id6760399383";
        var PLAY_BASE =
          "https://play.google.com/store/apps/details?id=com.phantomz.shakenearn";
        // Android 는 Install Referrer 로 설치 후 코드 회수가 가능하다.
        var PLAY_STORE = invite
          ? PLAY_BASE + "&referrer=" + encodeURIComponent("invite=" + invite)
          : PLAY_BASE;

        var ua = navigator.userAgent || navigator.vendor || "";
        var isIOS = /iphone|ipad|ipod/i.test(ua);
        var isAndroid = /android/i.test(ua);

        // iOS deferred deep link: App Store 는 referrer 가 없으므로, 초대코드를
        // 클립보드에 심어 앱 첫 실행 시 읽어 자동적용하도록 한다. 클립보드 쓰기는
        // 사용자 제스처(버튼 탭) 안에서 해야 iOS Safari 에서 안정적으로 동작한다.
        // 260723: 카톡 인앱브라우저 등 navigator.clipboard 미지원 환경 대비
        //         execCommand 폴백 추가.
        function legacyCopy(text) {
          try {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "absolute";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
          } catch (e) {}
        }
        function copyInvite() {
          if (!invite) return Promise.resolve();
          var text = "CASHSHAKE_INVITE:" + invite;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text).catch(function () {
              legacyCopy(text);
            });
          }
          legacyCopy(text);
          return Promise.resolve();
        }
        function go(url) {
          copyInvite().then(function () {
            location.href = url;
          });
        }

        if (invite) {
          document.getElementById("code").textContent = "초대코드 " + invite;
          document.getElementById("codeWrap").style.display = "block";
          // Android 는 스토어 링크 referrer 로 코드가 전달되므로 안내 문구는 iOS 만.
          if (!isIOS) document.getElementById("hint").style.display = "none";
        }

        var iosBtn = document.getElementById("iosBtn");
        var androidBtn = document.getElementById("androidBtn");
        iosBtn.href = APP_STORE;
        iosBtn.onclick = function (e) {
          e.preventDefault();
          go(APP_STORE);
        };
        androidBtn.href = PLAY_STORE;
        androidBtn.onclick = function (e) {
          e.preventDefault();
          go(PLAY_STORE);
        };

        // 260723 초대코드 유실 봉합:
        // - Android: Install Referrer 가 코드를 나르므로 자동 이동 유지.
        //   (제스처 없는 클립보드 쓰기는 어차피 차단되므로 시도하지 않는다.)
        // - iOS + 초대코드: 자동 이동을 멈추고 버튼 탭(사용자 제스처) 안에서
        //   클립보드에 코드를 심은 뒤 App Store 로 이동한다. 제스처 밖 쓰기는
        //   사파리·카톡 인앱브라우저가 차단해 코드가 유실되던 문제의 봉합.
        // - iOS + 코드 없음: 보존할 게 없으므로 기존대로 자동 이동.
        if (isAndroid) {
          location.replace(PLAY_STORE);
        } else if (isIOS && !invite) {
          location.replace(APP_STORE);
        }
      })();
    </script>
  </body>
</html>
